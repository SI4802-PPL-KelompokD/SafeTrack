name: Database readiness
on:
  push:
  pull_request:
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: safetrack_test
          MYSQL_USER: safetrack_ci
          MYSQL_PASSWORD: ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: safetrack_test
      DB_USERNAME: safetrack_ci
      DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, xml, fileinfo
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.testing.example .env.testing
      - run: php artisan key:generate --env=testing
      - run: php artisan migrate --force
      - run: php artisan db:seed --force
      - run: php artisan db:seed --force
      - run: php artisan migrate:rollback --force
      - run: php artisan migrate --force
      - run: php artisan safetrack:admin --help
      - run: php vendor/bin/phpunit
